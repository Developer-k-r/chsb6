<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHSB-1 O‘qituvchi Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=20261026a">
<style>
.grid2{display:grid;align-items:start;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.6em;line-height:1.1}
.stat span{font-size:.8em;color:var(--muted)}
.qrow{display:grid;grid-template-columns:2.4em minmax(0,1fr) 3.4em;gap:8px;align-items:center;font-size:.88em}
.qrow .n{font-weight:700;font-family:var(--f-mono)}
.qrow .p{font-family:var(--f-mono);font-weight:700;text-align:right}
.qrow .t{display:block;font-size:.85em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar i.lo{background:var(--bad)} .bar i.mid{background:var(--warn)} .bar i.hi{background:var(--ok)}
.tablewrap{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-size:.9em;font-variant-numeric:tabular-nums}
table.st th,table.st td{padding:6px 8px;border-bottom:1.5px solid var(--line);text-align:left;white-space:nowrap}
table.st th{font-size:.8em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
table.st tr.click{cursor:pointer} table.st tr.click:hover td{background:var(--bg)}
table.st td.num{text-align:right;font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--f-mono);font-size:.78em;padding:2px 6px;border-radius:6px;background:var(--ok-bg);color:var(--ok);font-weight:700}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.parts label{display:flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:4px 10px;cursor:pointer}
.link{font-family:var(--f-mono);font-size:.82em;word-break:break-all;background:var(--bg);border-radius:10px;padding:10px}
</style>
</head>
<body>
<div class="wrap wide" id="app">
  <div><span class="eyebrow">Matematika · CHSB-1</span><h1>O‘qituvchi paneli</h1></div>

  <div class="grid2">
    <section class="card" aria-labelledby="h-link">
      <h2 id="h-link">O‘quvchilar uchun havola</h2>
      <div class="link" id="lnk"></div>
      <div class="row"><button class="btn primary" id="copy">Havolani nusxalash</button><a class="btn" id="open" target="_blank" rel="noopener">Ochib ko‘rish</a><span id="cmsg" class="muted"></span></div>
      <span class="muted" style="font-size:.85em">Bitta havola ikkala sinf uchun. O‘quvchi ismi, sinfi (6 yoki 7) va harfini o‘zi tanlaydi. Vaqt — 90 daqiqa, savollar har safar bazadan tasodifiy tushadi, testni qayta ishlash mumkin.</span>
    </section>

    <section class="card" aria-labelledby="h-res">
      <h2 id="h-res">Natijalarni yuklash</h2>
      <div class="field"><label for="key">O‘qituvchi kaliti</label><input id="key" type="password" autocomplete="current-password" placeholder="Google skriptdagi KEY"></div>
      <div class="row"><button class="btn primary" id="load">Natijalarni yuklash</button><span id="lmsg" class="muted"></span></div>
      <div class="row">
        <div class="field"><label for="ft">Test</label><select id="ft"></select></div>
        <div class="field"><label for="fc">Sinf</label><select id="fc"></select></div>
      </div>
      <div class="field"><label for="fa">Urinishlar</label><select id="fa">
        <option value="first">Har o‘quvchining birinchi urinishi</option>
        <option value="best">Har o‘quvchining eng yaxshi urinishi</option>
        <option value="last">Har o‘quvchining oxirgi urinishi</option>
        <option value="all">Barcha urinishlar</option></select></div>
    </section>
  </div>

  <section class="card" id="sum" hidden></section>
  <div class="grid2" id="bys" hidden>
    <section class="card" id="byq"></section>
    <section class="card" id="byp"></section>
  </div>
  <section class="card" id="stu" hidden></section>
</div>

<script>
</script>
<script src="config.js?v=20261026a"></script>
<script src="common.js?v=20261026a"></script>
<script>
CHSB.boot([6, 7], function(){
let G = 6, Q = CHSB.load(6).questions, RQ = Q;
const CFG = window.CHSB_CONFIG || {}, esc = CHSB.esc, LET = "ABCD";
const $ = s => document.querySelector(s);
const fmt = v => String(v).replace(".", ",");
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------- havola ---------- */
const LINK = location.href.replace(/[^/]*([?#].*)?$/, "");
$("#lnk").textContent = LINK;
$("#open").href = LINK;
$("#copy").onclick = async () => {
  try { await navigator.clipboard.writeText(LINK); $("#cmsg").textContent = "Nusxalandi."; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("#lnk")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("#cmsg").textContent = "Belgilandi — nusxalang."; }
};

/* ---------- natijalar ---------- */
let ROWS = [];
$("#key").value = ls.get("chsb-key") || "";
if (!CFG.endpoint) $("#lmsg").textContent = "config.js da endpoint ko‘rsatilmagan.";
$("#load").onclick = async () => {
  if (!CFG.endpoint) return;
  const key = $("#key").value.trim(); ls.set("chsb-key", key);
  $("#lmsg").textContent = "Yuklanmoqda…";
  try {
    const r = await fetch(CFG.endpoint + "?key=" + encodeURIComponent(key));
    const j = await r.json();
    if (!j.ok) { $("#lmsg").textContent = j.error === "key" ? "Kalit noto‘g‘ri." : "Xato: " + (j.error || "noma’lum"); return; }
    ROWS = j.rows.filter(x => x && x.items);
    $("#lmsg").textContent = `${ROWS.length} ta natija yuklandi.`;
    fillFilters(); render();
  } catch (e) { $("#lmsg").textContent = "Ulanib bo‘lmadi. Internet va skript manzilini tekshiring."; }
};
function fillFilters() {
  const tests = [...new Set(ROWS.map(r => r.test))];
  const last = ls.get("chsb-ft");
  $("#ft").innerHTML = tests.map(t => `<option value="${esc(t)}" ${t === last ? "selected" : ""}>${CHSB.gradeOfTest(t)}-sinf · ${/^(7s-)?chsb[67]$/.test(t) ? "mashq testi" : esc(t.replace(/^7s-/, ""))}</option>`).join("");
  fillCls();
}
function fillCls() {
  const t = $("#ft").value;
  const cls = [...new Set(ROWS.filter(r => r.test === t).map(r => r.cls))].sort();
  $("#fc").innerHTML = `<option value="">Barcha sinflar</option>` + cls.map(c => `<option>${esc(c)}</option>`).join("");
}
$("#ft").onchange = () => { ls.set("chsb-ft", $("#ft").value); fillCls(); render(); };
$("#fc").onchange = render;
$("#fa").value = ls.get("chsb-fa") || "first";
$("#fa").onchange = () => { ls.set("chsb-fa", $("#fa").value); render(); };
const who = r => r.test + "|" + String(r.cls).toUpperCase() + "|" + String(r.name).toLowerCase().replace(/\s+/g, " ").trim();
const tm = r => new Date(r.time || r.finished || 0).getTime();
function pickAttempts(rows) {
  const g = {};
  rows.slice().sort((a, b) => tm(a) - tm(b)).forEach(r => { (g[who(r)] = g[who(r)] || []).push(r); });
  const out = [];
  Object.values(g).forEach(list => {
    list.forEach((r, i) => { r._att = i + 1; r._cnt = list.length; });
    const mode = $("#fa").value;
    if (mode === "all") out.push(...list);
    else if (mode === "last") out.push(list[list.length - 1]);
    else if (mode === "best") out.push(list.reduce((a, b) => (b.score > a.score ? b : a)));
    else out.push(list[0]);
  });
  return out;
}

function stats(rows) {
  const per = {};
  rows.forEach(r => r.items.forEach(it => { const s = per[it.n] = per[it.n] || { ok: 0, all: 0 }; s.all++; if (it.ok) s.ok++; }));
  const qp = n => per[n] && per[n].all ? per[n].ok / per[n].all * 100 : null;
  const wp = list => { let s = 0, w = 0; list.forEach(n => { const v = qp(n); if (v !== null) { s += v * RQ[n].ball; w += RQ[n].ball; } }); return w ? s / w : null; };
  return { per, qp, wp };
}
const cls3 = v => v === null ? "" : v < 50 ? "lo" : v < 75 ? "mid" : "hi";
const pc = v => v === null ? "—" : Math.round(v) + "%";

function render() {
  const t = $("#ft").value, c = $("#fc").value;
  RQ = CHSB.load(CHSB.gradeOfTest(t)).questions;
  const rows = pickAttempts(ROWS.filter(r => r.test === t && (!c || r.cls === c)));
  ["#sum", "#bys", "#stu"].forEach(s => $(s).hidden = !rows.length);
  if (!rows.length) return;
  const { per, qp, wp } = stats(rows);
  const qsAll = Object.keys(per).map(Number).sort((a, b) => a - b);
  const avg = rows.reduce((a, r) => a + r.score, 0) / rows.length, max = rows[0].max;
  const subj = rows.map(r => CHSB.subjectScores(RQ, r.items));
  const subjAvg = (subj[0] || []).map((x, k) => ({ name: x.name, max: x.max, avg: subj.reduce((a, s) => a + ((s[k] && s[k].score) || 0), 0) / rows.length }));
  const hard = qsAll.filter(n => qp(n) !== null).sort((a, b) => qp(a) - qp(b)).slice(0, 5);
  $("#sum").innerHTML = `<h2>${CHSB.gradeOfTest(t)}-sinf · ${/^(7s-)?chsb[67]$/.test(t) ? "mashq testi" : esc(t.replace(/^7s-/, ""))}${c ? " · " + esc(c) : ""}</h2>
    <div class="stats">
      <div class="stat"><b>${new Set(rows.map(who)).size}</b><span>qatnashgan o‘quvchi${$("#fa").value === "all" ? " · " + rows.length + " urinish" : ""}</span></div>
      <div class="stat"><b>${fmt(Math.round(avg * 10) / 10)}</b><span>o‘rtacha ball / ${fmt(max)}</span></div>
      <div class="stat"><b>${pc(wp(qsAll))}</b><span>umumiy o‘zlashtirish</span></div>
      <div class="stat"><b>${rows.filter(r => r.score / r.max >= .6).length}</b><span>60% va undan yuqori</span></div>
      ${subjAvg.map(x => `<div class="stat"><b>${fmt(Math.round(x.avg * 10) / 10)}</b><span>${x.name}: o‘rtacha ball / ${fmt(x.max)}</span></div>`).join("")}
    </div>
    <div><span class="eyebrow">Eng qiyin savollar</span><div class="chips" style="margin-top:6px">${hard.map(n => `<span class="chip bad">${n}-savol · ${pc(qp(n))}</span>`).join("")}</div></div>`;
  $("#byq").innerHTML = `<h2>Savollar bo‘yicha</h2>` + qsAll.map(n => { const v = qp(n);
    return `<div class="qrow"><span class="n">${n}.</span><span><span class="bar"><i class="${cls3(v)}" style="width:${v || 0}%"></i></span><span class="t">${esc(RQ[n].topic)} · ${per[n].ok}/${per[n].all}</span></span><span class="p">${pc(v)}</span></div>`; }).join("");
  const grp = [];
  const subjects = [...new Set(qsAll.map(n => RQ[n].subject).filter(Boolean))];
  subjects.forEach(s => grp.push({ name: s, list: qsAll.filter(n => RQ[n].subject === s), strong: true }));
  CHSB.parts(CHSB.gradeOfTest(t), RQ).forEach(p => { const list = qsAll.filter(n => n >= p.from && n <= p.to); if (list.length && !grp.some(g => g.list.join() === list.join())) grp.push({ name: p.label + " " + p.from + "–" + p.to, list }); });
  $("#byp").innerHTML = `<h2>${subjects.length ? "Fanlar va qismlar bo‘yicha" : "Qismlar bo‘yicha"}</h2>` + grp.map(g => { const v = wp(g.list);
    return `<div class="qrow" style="grid-template-columns:6.5em minmax(0,1fr) 3.4em"><span class="n" style="font-family:var(--f-body)">${g.strong ? "<b>" + g.name + "</b>" : g.name}</span><span><span class="bar"><i class="${cls3(v)}" style="width:${v || 0}%"></i></span><span class="t">${g.list[0]}–${g.list[g.list.length - 1]}-savollar</span></span><span class="p">${pc(v)}</span></div>`; }).join("") +
    `<span class="muted" style="font-size:.82em">Qism va umumiy foizlar savollar balliga mutanosib (qiyin savol ko‘proq hisobga olinadi).</span>`;
  const sorted = rows.slice().sort((a, b) => b.score - a.score || tm(a) - tm(b));
  $("#stu").innerHTML = `<h2>O‘quvchilar</h2><div class="tablewrap"><table class="st"><thead><tr><th>#</th><th>O‘quvchi</th><th>Sinf</th><th>Urinish</th><th>Ball</th>${subjAvg.map(x => `<th>${x.name}</th>`).join("")}<th>%</th><th>Vaqt</th><th>Sana</th></tr></thead><tbody>` +
    sorted.map((r, i) => `<tr class="click" data-i="${i}"><td>${i + 1}</td><td>${esc(r.name)}${r.timeout ? ' <span class="tag" style="color:var(--warn)">vaqt tugagan</span>' : ""}</td><td>${esc(r.cls)}</td><td class="num">${r._att}/${r._cnt}</td><td class="num">${fmt(r.score)}</td>${CHSB.subjectScores(RQ, r.items).map(x => `<td class="num">${fmt(x.score)}</td>`).join("")}<td class="num">${Math.round(r.score / r.max * 100)}%</td><td class="num">${CHSB.mmss(r.seconds)}</td><td>${new Date(r.time || r.finished).toLocaleString("uz-UZ", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</td></tr>
      <tr hidden data-d="${i}"><td colspan="${8 + subjAvg.length}"><div class="chips">${r.items.map(it => { const p = RQ[it.n] && RQ[it.n].problems && RQ[it.n].problems[it.p];
        const right = p ? LET[p.answer] : "?"; const got = it.a === null ? "—" : LET[it.a];
        return `<span class="chip${it.ok ? "" : " bad"}" title="To‘g‘ri javob: ${right}">${it.n}: ${got}${it.ok ? "" : "→" + right}</span>`; }).join("")}</div></td></tr>`).join("") +
    `</tbody></table></div><span class="muted" style="font-size:.82em">Qatorni bosing: har savol bo‘yicha o‘quvchi javobi (xato bo‘lsa, → to‘g‘ri javob).</span>`;
  document.querySelectorAll("#stu tr.click").forEach(tr => tr.onclick = () => { const d = document.querySelector(`#stu tr[data-d="${tr.dataset.i}"]`); d.hidden = !d.hidden; });
}
});
</script>
</body>
</html>
